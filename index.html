<!doctype html>
<html lang="tr" manifest="cache.appcache">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"
    />
    <title>Black Konsol | PS4 GoldHEN</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #05070d;
        color: #eef4ff;
        font-family: "Segoe UI", Arial, sans-serif;
      }
      body {
        min-height: 100vh;
        overflow: hidden;
      }
      body:before,
      body:after {
        content: "";
        position: fixed;
        border-radius: 50%;
        opacity: 0.34;
      }
      body:before {
        width: 440px;
        height: 440px;
        left: -190px;
        top: -230px;
        background: #006eff;
        box-shadow: 0 0 100px #006eff;
      }
      body:after {
        width: 360px;
        height: 360px;
        right: -180px;
        bottom: -210px;
        background: #7b20ff;
        box-shadow: 0 0 100px #7b20ff;
      }
      .grid {
        position: fixed;
        inset: 0;
        opacity: 0.12;
        background-image:
          linear-gradient(rgba(80, 150, 255, 0.35) 1px, transparent 1px),
          linear-gradient(90deg, rgba(80, 150, 255, 0.35) 1px, transparent 1px);
        background-size: 42px 42px;
      }
      .shell {
        position: relative;
        z-index: 1;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        height: 74px;
        padding: 0 38px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: rgba(5, 8, 16, 0.9);
        border-bottom: 1px solid #202d45;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      .brand-logo {
        width: 62px;
        height: 58px;
        object-fit: contain;
        filter: drop-shadow(0 0 10px rgba(48, 157, 255, 0.3));
      }
      .logo strong {
        font-size: 20px;
        letter-spacing: 0.13em;
      }
      .logo strong span {
        color: #4ba3ff;
      }
      .badge {
        padding: 8px 14px;
        border: 1px solid #263b5d;
        border-radius: 20px;
        color: #99b6dc;
        font-size: 12px;
        letter-spacing: 0.08em;
        background: #0c1422;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 28px;
      }
      .card {
        width: 700px;
        max-width: 94vw;
        padding: 42px 46px 35px;
        text-align: center;
        background: rgba(10, 15, 27, 0.94);
        border: 1px solid #253653;
        border-radius: 24px;
        box-shadow:
          0 24px 80px rgba(0, 0, 0, 0.5),
          inset 0 1px rgba(255, 255, 255, 0.04);
      }
      h1 {
        margin: 0 0 28px;
        font-size: 30px;
      }
      #state {
        min-height: 29px;
        font-size: 20px;
        font-weight: 700;
      }
      #det {
        margin-top: 12px;
        color: #7486a1;
        font-size: 18px;
        font-weight: 600;
      }
      #det b {
        color: #a9c9f6;
      }
      #cache {
        min-height: 20px;
        margin-top: 20px;
        color: #6b7d98;
        font-size: 17px;
        font-weight: 600;
      }
      #cache.cacheok,
      .ok {
        color: #55d998;
      }
      .bad {
        color: #ff6d7a !important;
      }
      .warn {
        color: #ffc45c !important;
      }
      .versions {
        margin-top: 29px;
        padding-top: 22px;
        border-top: 1px solid #1d2a40;
        display: flex;
        justify-content: center;
        gap: 9px;
      }
      .versions span {
        padding: 7px 11px;
        border: 1px solid #263957;
        border-radius: 7px;
        color: #8ca5c8;
        background: #0b1320;
        font-size: 12px;
      }
      footer {
        padding: 17px;
        text-align: center;
        color: #52647f;
        font-size: 11px;
        letter-spacing: 0.08em;
      }
      @media (max-width: 600px) {
        header {
          padding: 0 18px;
        }
        .badge {
          display: none;
        }
        .card {
          padding: 32px 20px;
        }
        h1 {
          font-size: 24px;
        }
        .versions {
          flex-wrap: wrap;
        }
      }
    </style>
  </head>
  <body>
    <div class="grid"></div>
    <div class="shell">
      <header>
        <div class="logo">
          <img class="brand-logo" src="black-konsol-logo.png" alt="Black Konsol" />
          <strong>BLACK <span>KONSOL</span></strong>
        </div>
        <div class="badge">This is a Jailbreak Page with AIO Fix patch applied.</div>
      </header>
      <main>
        <section class="card">
          <h1>PS4 Jailbreak Sayfası</h1>
          <div id="state">Yazılım sürümü denetleniyor...</div>
          <div id="det"></div>
          <div id="cache"></div>
          <div class="versions">
            <span>13.02</span><span>13.04</span><span>13.50</span
            ><span>13.52</span>
          </div>
        </section>
      </main>
      <footer>
        BLACK KONSOL TEKNİK SERVİS • GÜVENLİ VE HIZLI PS4 ÇÖZÜMLERİ
      </footer>
    </div>
    <script>
      (function () {
        var stateEl = document.getElementById("state"),
          detEl = document.getElementById("det"),
          cacheEl = document.getElementById("cache");
        function setState(t, c) {
          stateEl.textContent = t;
          stateEl.className = c || "";
        }
        function setCache(t, ok) {
          cacheEl.textContent = t;
          cacheEl.className = ok ? "cacheok" : "";
        }
        var params = new URLSearchParams(location.search),
          SUPPORTED = { 1302: 1, 1304: 1, 1350: 1, 1352: 1 },
          key = null,
          fwnum = null,
          m = /PlayStation\s+4[\/ ](\d+)\.(\d+)/.exec(navigator.userAgent);
        if (m) {
          var ms = parseInt(m[2], 16).toString(16);
          if (ms.length < 2) ms = "0" + ms;
          key = m[1] + "." + ms;
          fwnum = parseInt(m[1], 10) * 100 + parseInt(ms, 10);
        }
        var forced = params.get("force") === "1",
          supported = forced || (fwnum !== null && SUPPORTED[fwnum] === 1);
        detEl.innerHTML =
          "Yazılım: <b>" +
          (key || "algılanamadı") +
          "</b>" +
          (supported
            ? " &nbsp;•&nbsp; <b>uyumlu</b>"
            : " &nbsp;•&nbsp; bu sürüm destek listesinde değil");
        var target = "jb.html" + location.search;
        function go() {
          setState("Jailbreak başlatılıyor...", "warn");
          location.replace(target);
        }
        function waitForTap(msg, action) {
          setState(msg, "warn");
          function fire() {
            window.removeEventListener("click", fire);
            window.removeEventListener("keydown", fire);
            action();
          }
          window.addEventListener("click", fire);
          window.addEventListener("keydown", fire);
        }
        if (!supported) {
          setState("DESTEKLENMEYEN SÜRÜM", "bad");
          waitForTap("Yine de çalıştırmak için X tuşuna basın.", go);
          return;
        }
        var ac = window.applicationCache;
        if (!ac || !document.documentElement.hasAttribute("manifest")) {
          go();
        } else if (!navigator.onLine) {
          setCache("Çevrimdışı önbellekten çalıştırılıyor.", true);
          go();
        } else if (ac.status === ac.IDLE) {
          setCache("Çevrimdışı kullanım hazır.", true);
          go();
        } else if (ac.status === ac.UPDATEREADY) {
          try {
            ac.swapCache();
          } catch (e) {}
          setCache("Güncelleme indirildi.", true);
          waitForTap("Yenileyip çalıştırmak için X tuşuna basın.", function () {
            location.reload();
          });
        } else {
          setCache("Önbellek kontrol ediliyor...");
          ac.addEventListener(
            "downloading",
            function () {
              setCache("İlk kullanım için çevrimdışı dosyalar hazırlanıyor...");
            },
            false,
          );
          ac.addEventListener(
            "progress",
            function (e) {
              if (e && e.total)
                setCache(
                  "Hazırlanıyor: %" + Math.round((e.loaded / e.total) * 100),
                );
            },
            false,
          );
          ac.addEventListener(
            "cached",
            function () {
              setCache("Çevrimdışı kullanım hazır.", true);
              waitForTap("Devam etmek için X tuşuna basın.", go);
            },
            false,
          );
          ac.addEventListener(
            "updateready",
            function () {
              try {
                ac.swapCache();
              } catch (e) {}
              setCache("Güncelleme hazır.", true);
              waitForTap("Sayfayı yenilemek için X tuşuna basın.", function () {
                location.reload();
              });
            },
            false,
          );
          ac.addEventListener(
            "noupdate",
            function () {
              setCache("Çevrimdışı kullanım hazır.", true);
              go();
            },
            false,
          );
          ac.addEventListener(
            "error",
            function () {
              setCache("Önbellek hazırlanamadı.");
              waitForTap("Yine de çalıştırmak için X tuşuna basın.", go);
            },
            false,
          );
          ac.addEventListener(
            "obsolete",
            function () {
              setCache("Önbellek güncel değil.");
              waitForTap("Devam etmek için X tuşuna basın.", go);
            },
            false,
          );
        }
      })();
    </script>
  </body>
</html>
